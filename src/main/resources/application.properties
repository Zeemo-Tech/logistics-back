spring.application.name=logistics-back
server.port=8020
server.forward-headers-strategy=framework

# Comma-separated frontend origins. Keep localhost defaults for local development.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8848,http://127.0.0.1:8848}
app.auth.session-ttl=PT8H

spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Shanghai

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/logistics;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
